<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>RouteDiary — Мои маршруты</title>
<meta name="description" content="Дневник поездок: GPS-трек, учёт авто, калории и расходы — прямо в браузере, без сервера.">
<meta name="theme-color" content="#F2F3F7">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <main id="screens">
    <section id="screen-map" class="screen"></section>
    <section id="screen-trips" class="screen"></section>
    <section id="screen-car" class="screen"></section>
    <section id="screen-planner" class="screen"></section>
    <section id="screen-stats" class="screen"></section>
  </main>
  <nav id="tabbar">
    <button class="tab-btn" data-tab="map"><span class="tab-icon" data-icon="map"></span><span class="tab-label" data-i18n="tab.map"></span></button>
    <button class="tab-btn" data-tab="trips"><span class="tab-icon" data-icon="trips"></span><span class="tab-label" data-i18n="tab.trips"></span></button>
    <button class="tab-btn" data-tab="car"><span class="tab-icon" data-icon="car"></span><span class="tab-label" data-i18n="tab.car"></span></button>
    <button class="tab-btn" data-tab="planner"><span class="tab-icon" data-icon="planner"></span><span class="tab-label" data-i18n="tab.planner"></span></button>
    <button class="tab-btn" data-tab="stats"><span class="tab-icon" data-icon="stats"></span><span class="tab-label" data-i18n="tab.stats"></span></button>
  </nav>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
