<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Автопульс — дневник поездок и обслуживания автомобиля</title>
<meta name="description" content="Дневник поездок и обслуживания автомобиля. Записывает маршруты по GPS, помнит, когда менять масло и колодки, считает расход и траты. Работает офлайн, без регистрации и без магазина приложений.">
<link rel="canonical" href="https://autocoyc.com/">

<!-- Карточка ссылки. Без неё адрес, брошенный в чат автомобилистов,
     разворачивается голой строкой — а это ровно тот момент, когда
     работает сарафан. Адреса АБСОЛЮТНЫЕ: относительные мессенджеры не
     разрешают и картинку просто не покажут. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Автопульс">
<meta property="og:title" content="Автопульс — дневник поездок и обслуживания автомобиля">
<meta property="og:description" content="Дневник поездок и обслуживания автомобиля. Записывает маршруты по GPS, помнит, когда менять масло и колодки, считает расход и траты. Работает офлайн, без регистрации и без магазина приложений.">
<meta property="og:url" content="https://autocoyc.com/">
<meta property="og:image" content="https://autocoyc.com/icons/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Автопульс — дневник поездок и обслуживания автомобиля">
<meta property="og:locale" content="ru_RU">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0E9C93">
<meta name="app-version" content="74">
<link rel="manifest" href="manifest.json">
<!-- SVG — основной вариант; PNG и .ico нужны браузерам без поддержки SVG-фавиконок. -->
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<!-- Шрифт и карта — локальные копии. Через Google Fonts и CDN уходил бы
     IP-адрес пользователя при каждом запуске, а офлайн они бы не загрузились
     вовсе. Приложение обязано работать без сети. -->
<link rel="stylesheet" href="fonts/inter.css">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <main id="screens">
    <section id="screen-map" class="screen"></section>
    <section id="screen-trips" class="screen"></section>
    <section id="screen-car" class="screen"></section>
    <section id="screen-settings" class="screen"></section>
    <section id="screen-stats" class="screen"></section>
  </main>
  <nav id="tabbar">
    <button class="tab-btn" data-tab="map"><span class="tab-icon" data-icon="map"></span><span class="tab-label" data-i18n="tab.map"></span></button>
    <button class="tab-btn" data-tab="trips"><span class="tab-icon" data-icon="trips"></span><span class="tab-label" data-i18n="tab.trips"></span></button>
    <button class="tab-btn" data-tab="car"><span class="tab-icon" data-icon="car"></span><span class="tab-label" data-i18n="tab.car"></span></button>
    <button class="tab-btn" data-tab="settings"><span class="tab-icon" data-icon="settings"></span><span class="tab-label" data-i18n="tab.settings"></span></button>
    <button class="tab-btn" data-tab="stats"><span class="tab-icon" data-icon="stats"></span><span class="tab-label" data-i18n="tab.stats"></span></button>
  </nav>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
