<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#F97316"/>
  <g>
    <!-- Вилка под колесом: колесо рисуется поверх и закрывает её конец. -->
    <path d="M672,536 L742,708" fill="none" stroke="white" stroke-width="56" stroke-linecap="round"/>

    <circle cx="288" cy="708" r="142" fill="white"/>
    <circle cx="288" cy="708" r="80" fill="#F97316"/>
    <circle cx="744" cy="708" r="142" fill="white"/>
    <circle cx="744" cy="708" r="80" fill="#F97316"/>

    <!-- Брус бака соединяет колёса сам — отдельная перекладина рамы только
         мешала, читалась лишней линией между колёсами. -->
    <rect x="320" y="548" width="400" height="116" rx="46" fill="white"/>
    <rect x="336" y="486" width="190" height="86" rx="34" fill="white"/>
    <path d="M628,556 L700,470 Q724,442 756,462 L788,482 L724,584 Z" fill="white"/>
    <path d="M700,452 L806,404" fill="none" stroke="white" stroke-width="46" stroke-linecap="round"/>

    <!-- Пульс по центру бруса, не задевая краёв. -->
    <path d="M384,606 L448,606 L488,566 L522,646 L556,600 L628,600"
          fill="none" stroke="#F97316" stroke-width="32"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
